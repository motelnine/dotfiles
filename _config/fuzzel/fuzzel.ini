[main]
font=JetBrainsMono Nerd Font:size=11
use-bold=yes
prompt="❯  "
icon-theme=hicolor
icons-enabled=yes
fields=name,generic,comment
fuzzy=yes
show-actions=yes

# Layout
anchor=center
lines=10
width=48
horizontal-pad=20
vertical-pad=12
inner-pad=8
line-height=28
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Dark charcoal/slate
background=171923ee
text=cdd6f4ff
prompt=89b4faff
placeholder=858ba5ff
input=cdd6f4ff
match=89b4faff

# Selection
selection=313849ff
selection-text=cdd6f4ff
selection-match=89b4faff

# Border
border=68728aff
counter=858ba5ff

[border]
width=1
radius=10
selection-radius=6
